name: ai_roleplay
description: "本地优先的 AI 角色扮演前端壳程序（SillyTavern 兼容）"
publish_to: 'none'
version: 1.0.0+3017

environment:
  sdk: '>=3.4.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # 存储：直接使用官方 sqlite3（自带现代 SQLite，保证 FTS5 trigram 可用）
  sqlite3: ^2.4.6
  sqlite3_flutter_libs: ^0.5.24
  path_provider: ^2.1.4
  path: ^1.9.0

  # 状态管理
  flutter_riverpod: ^2.5.1

  # 网络
  dio: ^5.7.0

  # 安全存储
  flutter_secure_storage: ^9.2.2

  # 图表
  fl_chart: ^0.69.0

  # 文件
  file_picker: ^8.1.2
  image_picker: ^1.1.2
  share_plus: ^10.0.0

  uuid: ^4.5.0
  intl: ^0.19.0
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  # 随包分发的许可证文本（目前只有内置字体的 OFL）。
  # BSD-3 / Apache-2.0 / OFL 都要求分发时附带许可全文，
  # 代码里通过 LicenseRegistry 注册后在「关于 → 开源许可」里展示。
  assets:
    - assets/licenses/
  # 内置简体中文字形。
  #
  # 起因：Android 的 NotoSansCJK 是一个 TTC，内含 JP/KR/SC/TC/HK 五套字形，
  # 同一码位形状不同（实测「关」JP 套墨迹 721、SC 套 913）。不少 ROM 的
  # fonts.xml 把 zh-Hans 指向了 JP 那套，简中字会被画成日式写法。
  # 应用层无法切换（locale / 字体族名 / fallback 链都试过，真机验证无效），
  # 所以自带一份 SC 字形。
  #
  # 来源：Google Fonts 的 Noto Sans SC（SIL OFL 1.1，可随包分发）
  # 处理：可变字体实例化为 wght=400，再子集化到 GB2312 全部汉字 + 常用符号，
  #       16.9MB → 2.2MB。生僻字仍回退系统字体。
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC-Regular.ttf
